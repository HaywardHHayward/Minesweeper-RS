[package]
name = "minesweeper"
version = "0.6.52"
authors = ["Hayden Reckward <tictanic8@hotmail.com>"]
edition = "2024"
rust-version = "1.88.0"
description = "A version of Minesweeper written in Rust."
readme = "README.md"
repository = "https://github.com/HaywardHHayward/Minesweeper-RS"
license = "Artistic-2.0"
categories = ["games"]
publish = false

[[bench]]
required-features = ["benching"]
name = "benches"
harness = false

[dependencies]
thiserror = "2.0"
rand = "0.9.2"
iced = { version = "0.14.0", features = ["image", "tokio", "svg"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_yml = "0.0.12"
directories = "6.0"
zip = "7.0.0"
tinyvec = "1.10"
ciborium = "0.2.2"
whoami = "2.0.2"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5", features = ["cargo", "derive"] }
rfd = "0.17"
anyhow = "1.0"

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }

[build-dependencies]
zip = "7.0.0"
walkdir = "2.5"

[features]
default = ["non-free"]
benching = []
non-free = []

[profile.release]
lto = "thin"
